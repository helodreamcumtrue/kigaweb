<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="kiga-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16181D"/>
      <stop offset="100%" stop-color="#0E1013"/>
    </linearGradient>
  </defs>
  <!-- Squircle Base -->
  <rect width="64" height="64" rx="18" fill="url(#kiga-bg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="16.5" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>

  <!-- Bold Lowercase "k" -->
  <rect x="15" y="14" width="8" height="36" rx="3.5" fill="#FFFFFF"/>
  <path d="M22 32.5 L36 18.5" stroke="#FFFFFF" stroke-width="7.5" stroke-linecap="round"/>
  <path d="M25.5 30 L37.5 46" stroke="#FFFFFF" stroke-width="7.5" stroke-linecap="round"/>

  <!-- Signature Kiga Asterisk (*) in Electric Cobalt Blue with Gold Core -->
  <g stroke="#2563EB" stroke-width="3" stroke-linecap="round">
    <line x1="48" y1="12" x2="48" y2="26"/>
    <line x1="41" y1="19" x2="55" y2="19"/>
    <line x1="43.05" y1="14.05" x2="52.95" y2="23.95"/>
    <line x1="52.95" y1="14.05" x2="43.05" y2="23.95"/>
  </g>
  <circle cx="48" cy="19" r="2.2" fill="#F5C22B"/>
</svg>
